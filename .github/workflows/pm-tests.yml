name: Research PM Tests
on:
  pull_request:
    branches: ["main", "feature/research-pm-phase1"]
  push:
    branches: ["feature/research-pm-phase1", "feature/research-pm-v06-optimization"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pm-tests:
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      PYTHONPATH: src
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Retain reproducible source snapshot
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: pm-source-${{ github.sha }}
          retention-days: 7
          path: |
            src/
            tests/
            docs/
            scripts/
            pyproject.toml
            README.md
            LICENSE
            RESEARCH_PM_KO.md
            START_RESEARCH_PM.bat
            INSTALL_PM_DEPENDENCIES.bat
            UPDATE_SEARCH_BACKEND.bat
            APPLY_0.6.2.txt
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install project
        run: python -m pip install -e .
      - name: Run Linux regression suite with GUI
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -o pipefail
          xvfb-run -a python -m unittest discover -s tests -v 2>&1 | tee pm-tests.log
      - name: Run Windows regression suite with GUI
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          python -m unittest discover -s tests -v 2>&1 | Tee-Object -FilePath pm-tests.log
          exit $LASTEXITCODE
      - name: Compile PM modules
        run: python -m compileall -q src/ollama_deep_researcher scripts
      - name: Retain regression log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pm-tests-${{ matrix.os }}-${{ github.sha }}
          retention-days: 7
          path: pm-tests.log
          if-no-files-found: ignore
