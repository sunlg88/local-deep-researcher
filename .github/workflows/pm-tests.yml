name: Research PM Tests

on:
  pull_request:
    branches: [ "main" ]
  push:
    branches: [ "feature/research-pm-phase1" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pm-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Retain reproducible source snapshot
        uses: actions/upload-artifact@v4
        with:
          name: pm-source-${{ github.sha }}
          retention-days: 7
          path: |
            src/
            tests/
            docs/
            pyproject.toml
            RESEARCH_PM_KO.md
            START_RESEARCH_PM.bat
            INSTALL_PM_DEPENDENCIES.bat
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install project
        run: python -m pip install -e .
      - name: Run PM regression suite with GUI
        run: |
          set -o pipefail
          xvfb-run -a env PYTHONPATH=src python -m unittest discover -s tests -v 2>&1 | tee pm-tests.log
      - name: Compile PM modules
        run: python -m compileall -q src/ollama_deep_researcher
      - name: Retain regression log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pm-tests-${{ github.sha }}
          retention-days: 7
          path: pm-tests.log
          if-no-files-found: ignore
