name: Research PM Tests

on:
  pull_request:
    branches: [ "main" ]
  push:
    branches: [ "feature/research-pm-phase1" ]

permissions:
  contents: read

jobs:
  pm-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install project
        run: python -m pip install -e .
      - name: Run PM regression suite with GUI
        run: xvfb-run -a env PYTHONPATH=src python -m unittest discover -s tests -v
      - name: Compile PM modules
        run: python -m compileall -q src/ollama_deep_researcher
